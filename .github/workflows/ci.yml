name: stitch-ci

on:
  push:
    paths:
      - "examples/**"
      - "core/skills/fingerprint-check/**"
      - "core/scripts/**"
  pull_request:
    paths:
      - "examples/**"
      - "core/skills/fingerprint-check/**"
      - "core/scripts/**"

jobs:
  fingerprint-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: chmod scripts
        run: chmod +x core/skills/fingerprint-check/scripts/check-fingerprint.sh core/scripts/gate.sh

      - name: Fingerprint MATCH (hello-v1)
        working-directory: examples/tiny-dual
        run: |
          ../../core/skills/fingerprint-check/scripts/check-fingerprint.sh hello-v1.md

      - name: Fingerprint MISMATCH exits non-zero
        working-directory: examples/tiny-dual
        run: |
          set -euo pipefail
          FP="$GITHUB_WORKSPACE/core/skills/fingerprint-check/scripts/check-fingerprint.sh"
          tmp="$(mktemp -d)"
          cp -R "$PWD/." "$tmp/tiny-dual"
          echo "" >> "$tmp/tiny-dual/client/docs/contracts/hello-v1.md"
          echo "drift-$(date -u +%s)" >> "$tmp/tiny-dual/client/docs/contracts/hello-v1.md"
          cd "$tmp/tiny-dual"
          set +e
          "$FP" hello-v1.md
          rc=$?
          set -e
          if [[ "$rc" -eq 2 ]]; then
            echo "ok: MISMATCH returned exit 2"
            exit 0
          fi
          echo "expected exit 2 on MISMATCH, got $rc" >&2
          exit 1

      - name: Gate PASS (fingerprint + require_tests ledger evidence)
        working-directory: examples/tiny-dual
        run: |
          ../../core/scripts/gate.sh --contract hello-v1.md
