# Minimal schema (informal)

version: 1
ledger_index: string optional

client:
  id: string optional
  root: string required
  ledger: string
  skill: string

server:
  id: string optional
  root: string required
  ledger: string
  skill: string

clients: list of { id, root, ledger, skill }   # optional
servers: list of { id, root, ledger, skill }   # optional

ledgers:
  - id: string
    paths: map of side_id → relative ledger path

defaults:
  server_first: boolean
