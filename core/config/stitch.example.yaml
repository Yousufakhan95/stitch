# stitch.yaml example

version: 1

ledger_index: docs/LEDGER_INDEX.md

client:
  id: web
  root: ../my-app
  ledger: docs/STITCH_LEDGER.md
  skill: stitch-client

server:
  id: api
  root: ../my-api
  ledger: docs/STITCH_LEDGER.md
  skill: stitch-server

# Optional multi-ledger
# ledgers:
#   - id: main
#     paths:
#       web: docs/STITCH_LEDGER.md
#       api: docs/STITCH_LEDGER.md
#   - id: billing
#     paths:
#       web: docs/ledgers/BILLING.md
#       api: docs/ledgers/BILLING.md

# Optional extra sides — see docs/ADD_ON.md
# clients:
#   - id: mobile
#     root: ../mobile
#     skill: stitch-client-mobile
#     ledger: docs/STITCH_LEDGER.md
# servers:
#   - id: users
#     root: ../users
#     skill: stitch-users
#     ledger: docs/STITCH_LEDGER.md

defaults:
  server_first: true
